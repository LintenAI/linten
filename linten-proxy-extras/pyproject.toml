[project]
name = "linten-proxy-extras"
version = "0.4.114"
description = "Additional files for the Linten Proxy. Reduces the size of the main linten package."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psycopg>=3.2,<4.0",
    "psycopg-binary>=3.2,<4.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LintenAI" },
]

[project.urls]
Homepage = "https://linten.ai"
Repository = "https://github.com/LintenAI/linten"
Documentation = "https://docs.linten.ai"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.4.114"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:linten-proxy-extras==",
]
