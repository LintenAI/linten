services:
  - type: web
    name: openai-proxy
    runtime: image
    image:
      url: ghcr.io/lintenai/linten:main-stable
    envVars:
      - key: PORT
        value: 4000
      - key: LINTEN_MASTER_KEY
        generateValue: true
    numInstances: 1
    healthCheckPath: /health/liveliness
    autoDeploy: true
