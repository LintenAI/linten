[project]
name = "linten-enterprise"
version = "0.1.83"
description = "Package for Linten Enterprise features"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
authors = [
    { name = "LintenAI" },
]

[project.urls]
Homepage = "https://linten.ai"
Repository = "https://github.com/LintenAI/linten"
Documentation = "https://docs.linten.ai"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.1.83"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:linten-enterprise==",
]
