model_list:
  - model_name: oci-cohere-command
    linten_params:
      model: oci/cohere.command-latest
  - model_name: oci-llama
    linten_params:
      model: oci/meta.llama-3.3-70b-instruct
  - model_name: oci-gemini
    linten_params:
      model: oci/google.gemini-2.5-flash
  - model_name: oci-grok
    linten_params:
      model: oci/xai.grok-3-mini
  - model_name: oci-embed
    linten_params:
      model: oci/cohere.embed-v4.0
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LINTEN_MASTER_KEY
  disable_model_info_refresh: true

linten_settings:
  drop_params: True
